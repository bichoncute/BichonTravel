<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${isEdit} ? '編輯行程內容' : '建立行程'">
        行程表單
    </title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            font-family:
                "Noto Serif TC",
                "Microsoft JhengHei",
                "PingFang TC",
                serif;
            color: #3f493f;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(
                    rgba(30, 55, 38, 0.28),
                    rgba(30, 55, 38, 0.28)
                ),
                url("/images/china1.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -2;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 245, 0.10);
            backdrop-filter: blur(1px);
            z-index: -1;
        }

        .container {
            width: 92%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 38px 42px 45px;
            background:
                linear-gradient(
                    135deg,
                    rgba(250, 249, 239, 0.94),
                    rgba(239, 240, 224, 0.88)
                );
            border-radius: 28px;
            box-shadow:
                0 18px 45px rgba(20, 50, 30, 0.30),
                inset 0 0 0 1px rgba(255, 255, 255, 0.55);
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 7px;
            background:
                linear-gradient(
                    90deg,
                    #176b4b,
                    #4d896c,
                    #c99a3b,
                    #4d896c,
                    #176b4b
                );
        }

        h1 {
            margin: 0 0 10px;
            text-align: center;
            color: #31583f;
            font-size: 34px;
            letter-spacing: 5px;
            font-weight: 700;
        }

        .page-subtitle {
            text-align: center;
            margin-bottom: 30px;
            color: #777d6d;
            font-size: 15px;
            letter-spacing: 2px;
        }

        .form-card {
            width: 100%;
            margin: 25px auto 0;
            background: rgba(255, 255, 255, 0.58);
            border-radius: 20px;
            box-shadow:
                0 8px 22px rgba(35, 60, 40, 0.12);
            overflow: hidden;
            border: 1px solid rgba(100, 110, 90, 0.15);
        }

        .form-header {
            padding: 18px 25px;
            background:
                linear-gradient(
                    135deg,
                    #285d43,
                    #397354
                );
            color: white;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 2px;
            border-bottom: 3px solid #c8a14a;
        }

        .form-body {
            padding: 28px 30px 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #52604e;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid rgba(100, 110, 90, 0.25);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.78);
            color: #3f493f;
            font-family:
                "Noto Serif TC",
                "Microsoft JhengHei",
                sans-serif;
            font-size: 15px;
            outline: none;
            transition: all 0.2s ease;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #397052;
            box-shadow: 0 0 0 3px rgba(57, 112, 82, 0.12);
            background: white;
        }

        .bottom-actions {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 11px 25px;
            margin: 3px;
            border: none;
            border-radius: 25px;
            text-decoration: none;
            font-family:
                "Noto Serif TC",
                "Microsoft JhengHei",
                sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow:
                0 3px 8px rgba(0, 0, 0, 0.12);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow:
                0 6px 14px rgba(0, 0, 0, 0.18);
        }

        .btn-primary {
            background:
                linear-gradient(
                    135deg,
                    #197451,
                    #39906b
                );
            color: white;
        }

        .btn-primary:hover {
            background:
                linear-gradient(
                    135deg,
                    #126043,
                    #2e7959
                );
        }

        .btn-secondary {
            background:
                linear-gradient(
                    135deg,
                    #5d7f72,
                    #78988b
                );
            color: white;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: auto;
            }
        }

        @media (max-width: 900px) {
            body {
                padding: 20px 10px;
            }

            .container {
                width: 100%;
                padding: 30px 18px 35px;
                border-radius: 20px;
            }

            h1 {
                font-size: 28px;
                letter-spacing: 3px;
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 10px 5px;
            }

            .container {
                padding: 28px 10px 30px;
            }

            h1 {
                font-size: 24px;
                letter-spacing: 2px;
            }

            .page-subtitle {
                font-size: 13px;
            }

            .form-body {
                padding: 22px 18px;
            }

            .bottom-actions {
                flex-direction: column;
                align-items: stretch;
            }

            .bottom-actions .btn {
                text-align: center;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1 th:text="${isEdit} ? '編輯行程內容' : '建立新行程'">
        行程表單
    </h1>

    <div class="page-subtitle">
        PRODUCT INFORMATION
    </div>

    <div class="form-card">

        <div class="form-header">
            行程資料
        </div>

        <div class="form-body">

            <form
                th:object="${product}"
                method="post">

                <div class="form-grid">

                    <div class="form-group full-width">
                        <label for="name">行程名稱</label>
                        <input
                            type="text"
                            id="name"
                            th:field="*{name}"
                            placeholder="請輸入行程名稱"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="adult_double_price">雙人床票價</label>
                        <input
                            type="number"
                            id="adult_double_price"
                            th:field="*{adult_double_price}"
                            min="0"
                            step="0.01"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="adult_single_price">單人床票價</label>
                        <input
                            type="number"
                            id="adult_single_price"
                            th:field="*{adult_single_price}"
                            min="0"
                            step="0.01"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="infant_price">嬰兒票價</label>
                        <input
                            type="number"
                            id="infant_price"
                            th:field="*{infant_price}"
                            min="0"
                            step="0.01"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="departure_airport">機場</label>
                        <select
                            id="departure_airport"
                            th:field="*{departure_airport}"
                            required>

                            <option value="" disabled>
                                請選擇機場
                            </option>

                            <option value="桃園國際機場">
                                桃園國際機場
                            </option>

                        </select>
                    </div>

                    <div class="form-group">
                        <label for="destination">目的地</label>
                        <input
                            type="text"
                            id="destination"
                            th:field="*{destination}"
                            placeholder="例如：東京、大阪"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="max_capacity">可售票數</label>
                        <input
                            type="number"
                            id="max_capacity"
                            th:field="*{max_capacity}"
                            min="0"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="available_capacity">剩餘機位</label>
                        <input
                            type="number"
                            id="available_capacity"
                            th:field="*{available_capacity}"
                            min="0"
                            required>
                    </div>

                    <div class="form-group full-width">
                        <label for="description">行程描述</label>
                        <textarea
                            id="description"
                            th:field="*{description}"
                            placeholder="請輸入行程描述"
                            required></textarea>
                    </div>

                    <div class="form-group full-width">
                        <label for="notification">註記</label>
                        <textarea
                            id="notification"
                            th:field="*{notification}"
                            placeholder="請輸入注意事項或註記"
                            required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="product_status">行程狀態</label>

                        <select
                            id="product_status"
                            th:field="*{product_status}"
                            required>

                            <option value="" disabled>
                                請選擇狀態
                            </option>

                            <option value="TOUR_OPEN">
                                TOUR_OPEN
                            </option>

                            <option value="TOUR_CONFIRMED">
                                TOUR_CONFIRMED
                            </option>

                            <option value="TOUR_FULL">
                                TOUR_FULL
                            </option>

                            <option value="TOUR_CANCELLED">
                                TOUR_CANCELLED
                            </option>

                            <option value="TOUR_OFFLINE">
                                TOUR_OFFLINE
                            </option>

                        </select>
                    </div>

                    <div class="form-group">
                        <label for="fly_day">
                            起飛日
                        </label>

                        <input
                            type="text"
                            id="fly_day"
                            th:field="*{fly_day}"
                            placeholder="例如：2026-09-01"
                            required>

                    </div>

                    <div class="form-group">
                        <label for="back_day">
                            返回日
                        </label>

                        <input
                            type="text"
                            id="back_day"
                            th:field="*{back_day}"
                            placeholder="例如：2026-09-15"
                            required>
                    </div>

                </div>

                <div class="bottom-actions">

                    <button
                        th:if="${isEdit}"
                        type="submit"
                        class="btn btn-primary"
                        th:formaction="@{/web/products/{product_id}/edit(product_id=${product.product_id})}">
                        更新
                    </button>

                    <button
                        th:unless="${isEdit}"
                        type="submit"
                        class="btn btn-primary"
                        th:formaction="@{/web/products/create}">
                        建立
                    </button>

                    <a
                        th:href="@{/web/products}"
                        class="btn btn-secondary">
                        取消
                    </a>

                </div>

            </form>

        </div>
    </div>

</div>

</body>
</html>
