<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>我的購物車 | 探索世界</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Noto Sans TC", sans-serif;
        }

        body {
            min-height: 100vh;

            background:
                linear-gradient(rgba(25,55,42,0.52), rgba(25,55,42,0.52)),
                url('/images/tea.jpg') center center / cover fixed no-repeat;

            color: #34443a;

            padding: 45px 20px;
        }

        .container {
            width: 94%;
            max-width: 1250px;
            margin: auto;
        }

        /* =========================
           標題
        ========================= */

        .page-title {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .page-title h1 {
            font-size: 42px;
            letter-spacing: 5px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.35);
        }

        .page-title p {
            margin-top: 8px;
            letter-spacing: 2px;
        }

        /* =========================
           主面板
        ========================= */

        .content-panel {
            background: rgba(248,247,238,0.94);
            border-radius: 28px;

            padding: 35px;

            box-shadow:
                0 15px 40px rgba(0,0,0,0.25);
        }

        /* =========================
           成功訊息
        ========================= */

        .alert {
            padding: 14px 20px;
            margin-bottom: 25px;

            border-radius: 12px;

            background: #e5f1e8;
            color: #286044;

            border-left: 5px solid #3d8b65;
        }

        /* =========================
           統計
        ========================= */

        .summary {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 25px;
        }

        .summary-title {
            color: #315b48;
            font-size: 22px;
            font-weight: 600;
        }

        .count {
            color: #d39b2f;
            font-size: 26px;
            font-weight: 700;
        }

        /* =========================
           表格
        ========================= */

        .table-wrapper {
            overflow-x: auto;
            border-radius: 16px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(255,255,255,0.72);
        }

        th {
            padding: 17px 14px;

            background: #3c6b53;
            color: white;

            font-weight: 600;
            letter-spacing: 1px;
        }

        td {
            padding: 17px 14px;

            border-bottom: 1px solid #dddccc;

            color: #465449;
            background: rgba(255,255,255,0.55);
        }

        tr:hover td {
            background: #f1f4e9;
        }

        /* =========================
           行程名稱
        ========================= */

        .product-name {
            color: #315b48;
            font-weight: 700;
        }

        /* =========================
           按鈕
        ========================= */

        .btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;

            padding: 9px 17px;
            margin: 2px;

            border-radius: 22px;

            text-decoration: none;

            font-size: 14px;
            font-weight: 600;

            border: none;
            cursor: pointer;

            transition: all 0.2s ease;
        }

        .btn-buy {
            background: #d9a441;
            color: white;
        }

        .btn-buy:hover {
            background: #c18b28;
            transform: translateY(-2px);
        }

        .btn-delete {
            background: #f3dede;
            color: #a43c3c;
        }

        .btn-delete:hover {
            background: #bd4a4a;
            color: white;
        }

        /* =========================
           底部按鈕
        ========================= */

        .footer-actions {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn-footer {
            padding: 12px 24px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
        }

        .btn-member {
            background: #3c6b53;
            color: white;
        }

        .btn-home {
            background: transparent;
            border: 2px solid #3c6b53;
            color: #3c6b53;
        }

        .btn-member:hover,
        .btn-home:hover {
            transform: translateY(-2px);
        }

        /* =========================
           RWD
        ========================= */

        @media(max-width:700px) {

            body {
                padding: 25px 10px;
            }

            .content-panel {
                padding: 20px 15px;
            }

            .page-title h1 {
                font-size: 30px;
            }

            .footer-actions {
                flex-direction: column;
            }

            .btn-footer {
                text-align: center;
            }
        }

    </style>

</head>


<body>

<div class="container">

    <!-- 標題 -->

    <div class="page-title">

        <h1>我的購物車</h1>

        <p>My Travel Wishlist</p>

    </div>


    <div class="content-panel">

        <!-- 成功訊息 -->

        <div
            th:if="${successMessage}"
            class="alert"
            th:text="${successMessage}">

            成功訊息

        </div>


        <!-- 統計 -->

        <div class="summary">

            <div class="summary-title">
                我的旅遊收藏
            </div>

            <div>
                共
                <span
                    class="count"
                    th:text="${cartCount}">
                    0
                </span>
                項行程
            </div>

        </div>


        <!-- 表格 -->

        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>購物車 ID</th>

                        <th>行程名稱</th>

                        <th>出發日期</th>

                        <th>返回日期</th>

                        <th>目的地</th>

                        <th>操作</th>

                    </tr>

                </thead>


                <tbody>

                    <tr th:each="cart_item : ${cart}">

                        <td
                            th:text="${cart_item.cart_item_id}">
                            購物車ID
                        </td>


                        <td
                            class="product-name"
                            th:text="${cart_item.products.name}">
                            行程名稱
                        </td>


                        <td
                            th:text="${cart_item.products.fly_day}">
                            出發日期
                        </td>


                        <td
                            th:text="${cart_item.products.back_day}">
                            返回日期
                        </td>


                        <td
                            th:text="${cart_item.products.destination}">
                            目的地
                        </td>


                        <td>

                            <!-- 立即購買 -->

                            <a
                                th:href="@{/web/frontproducts/buy/{product_id}(product_id=${cart_item.products.product_id})}"
                                class="btn btn-buy">

                                立即購買

                            </a>


                            <!-- 刪除 -->

                            <form
                                th:action="@{/web/member/{cart_item_id}/delete(cart_item_id=${cart_item.cart_item_id})}"
                                method="post"
                                style="display:inline;">

                                <button
                                    type="submit"
                                    class="btn btn-delete"
                                    onclick="return confirm('確定要從購物車移除這個行程嗎？')">

                                    刪除

                                </button>

                            </form>

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>


        <!-- 底部 -->

        <div class="footer-actions">

            <a
                th:href="@{/web/member}"
                class="btn-footer btn-member">

                返回會員專區

            </a>


            <a
                th:href="@{/web/frontproducts}"
                class="btn-footer btn-home">

                繼續探索行程

            </a>

        </div>

    </div>

</div>

</body>

</html>
