<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>旅客列表</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            font-family: "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif;
            color: #3f463d;
        }

        body {
            min-height: 100vh;

            background-image:
                linear-gradient(
                    rgba(24,48,35,0.38),
                    rgba(24,48,35,0.38)
                ),
                url('/images/europe1.jpg');

            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }

        .container {
            width: 94%;
            max-width: 1450px;

            margin: 40px auto;

            padding: 35px 40px 45px;

            background: rgba(248,247,238,0.90);

            border-radius: 30px;

            border: 1px solid rgba(255,255,255,0.75);

            box-shadow:
                0 15px 45px rgba(0,0,0,0.25),
                inset 0 1px 0 rgba(255,255,255,0.8);

            backdrop-filter: blur(5px);
        }

        h1 {
            margin: 0 0 25px;

            text-align: center;

            color: #28533d;

            font-size: 34px;

            letter-spacing: 5px;
        }

        h1::before {
            content: "👤";
            margin-right: 12px;
        }

        .alert {
            padding: 14px 20px;

            margin: 15px 0 22px;

            border-radius: 14px;

            text-align: center;

            font-weight: bold;
        }

        .alert-success {
            background: rgba(218,239,221,0.90);

            color: #28613d;

            border: 1px solid #a8c9af;
        }

        .summary {
            margin-bottom: 18px;

            color: #65685d;

            font-size: 17px;
        }

        .summary span {
            color: #c79532;

            font-size: 22px;

            font-weight: bold;
        }

        .btn {
            display: inline-block;

            padding: 9px 17px;

            margin: 3px;

            border: none;

            border-radius: 20px;

            text-decoration: none;

            cursor: pointer;

            font-family: inherit;

            transition: 0.25s;

            box-shadow: 0 3px 8px rgba(0,0,0,0.15);
        }

        .btn:hover {
            transform: translateY(-2px);

            box-shadow: 0 6px 12px rgba(0,0,0,0.20);
        }

        .btn-primary {
            background: linear-gradient(135deg,#4d8b70,#2e6650);

            color: white;
        }

        .btn-success {
            background: linear-gradient(135deg,#d8aa45,#bd8423);

            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg,#c96b67,#a84743);

            color: white;
        }

        .btn-create {
            display: inline-block;

            margin-bottom: 25px;

            padding: 12px 24px;

            border-radius: 24px;

            background: linear-gradient(135deg,#dcb65b,#c58c29);

            color: white;

            text-decoration: none;

            font-weight: bold;
        }

        .table-wrapper {
            width: 100%;

            overflow-x: auto;

            border-radius: 20px;

            box-shadow: 0 5px 18px rgba(0,0,0,0.10);
        }

        table {
            border-collapse: separate;

            border-spacing: 0;

            width: 100%;

            min-width: 1200px;

            background: rgba(255,255,255,0.72);
        }

        th {
            padding: 15px 12px;

            background: linear-gradient(
                135deg,
                #376b52,
                #28533d
            );

            color: white;

            text-align: center;

            white-space: nowrap;
        }

        td {
            padding: 13px 12px;

            text-align: center;

            border-bottom: 1px solid rgba(120,120,120,0.15);

            white-space: nowrap;
        }

        tbody tr {
            transition: 0.2s;
        }

        tbody tr:hover {
            background: rgba(226,237,224,0.80);
        }

        .type-badge {
            display: inline-block;

            padding: 6px 12px;

            border-radius: 16px;

            background: rgba(77,139,112,0.15);

            color: #376b52;

            font-weight: bold;
        }

        .room-badge {
            display: inline-block;

            padding: 6px 12px;

            border-radius: 16px;

            background: rgba(216,170,69,0.18);

            color: #9b6d18;

            font-weight: bold;
        }

        .action-cell {
            min-width: 230px;

            white-space: normal;
        }

        .action-cell form {
            display: inline-block;
        }
		.bottom-actions .btn {
                text-align: center;
            }
         .btn-gold {
            background:
                linear-gradient(
                    135deg,
                    #a98232,
                    #c9a14a
                );

            color: white;
        }
    </style>

</head>

<body>

<div class="container">

    <h1>旅客列表</h1>

    <!-- 成功訊息 -->

    <div th:if="${successMessage}"
         class="alert alert-success"
         th:text="${successMessage}">

        成功訊息

    </div>

    <!-- 統計資訊 -->

    <div class="summary">

        共
        <span th:text="${order_travelersCount}">0</span>
        位旅客

    </div>

    <!-- 新增旅客 -->

    <a th:unless="${isDash}"
    		th:href="@{/web/order_travelers/create/{order_id}(order_id=${order_id})}"
       class="btn-create">

        ＋ 新增旅客

    </a>

    <!-- 旅客表格 -->

    <div class="table-wrapper">

        <table>

            <thead>

            <tr>

                <th>旅客ID</th>

                <th>訂單ID</th>

                <th>乘客姓名</th>

                <th>護照號碼</th>

                <th>手機號碼</th>

                <th>Line帳號</th>

                <th>特殊需求</th>

                <th>成人／嬰兒</th>

                <th>單／雙人床</th>

                <th>操作</th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="order_travelers : ${order_travelers}">

                <td th:text="${order_travelers.travelers_id}">
                    ID
                </td>

                <td th:text="${order_travelers.orders.order_id}">
                    order_id
                </td>

                <td th:text="${order_travelers.travelers_real_name}">
                    乘客姓名
                </td>

                <td th:text="${order_travelers.passport_num}">
                    護照號碼
                </td>

                <td th:text="${order_travelers.phone_num}">
                    手機號碼
                </td>

                <td th:text="${order_travelers.line_account}">
                    Line帳號
                </td>

                <td th:text="${order_travelers.special_request}">
                    特殊需求
                </td>

                <td>

                    <span class="type-badge"
                          th:text="${order_travelers.traveler_type}">
                        成人/嬰兒
                    </span>

                </td>

                <td>

                    <span class="room-badge"
                          th:text="${order_travelers.room_type}">
                        單/雙人床
                    </span>

                </td>

                <td class="action-cell">

                    <a th:href="@{/web/order_travelers/{travelers_id}(travelers_id=${order_travelers.travelers_id})}"
                       class="btn btn-primary">

                        詳情

                    </a>

                    <a th:href="@{/web/order_travelers/{travelers_id}/edit(travelers_id=${order_travelers.travelers_id})}"
                       class="btn btn-success">

                        編輯

                    </a>

                    <form th:action="@{/web/order_travelers/{travelers_id}/delete(travelers_id=${order_travelers.travelers_id})}"
                          method="post">

                        <button type="submit"
                                class="btn btn-danger"
                                onclick="return confirm('確定要刪除嗎？')">

                            刪除

                        </button>

                    </form>

                </td>

            </tr>

            </tbody>

        </table>
        <div class="bottom-nav">
        	<a th:if="${isDash}"  
        	th:href="@{/web/dashboard}"
           		class="btn btn-gold">
            	← 返回管理者後台
        	</a>
    		<a th:unless="${isDash}" 
   			th:href="@{/web/payments/checkout/{order_id}(order_id=${order_id})}"
   			class="btn btn-gold">前往付款
		    </a>
	   </div>
</body>

</html>
