<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>旅客資料詳情</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;

            font-family:
                "Noto Serif TC",
                "Microsoft JhengHei",
                "PingFang TC",
                serif;

            color: #3f493f;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;

            background-image:
                linear-gradient(
                    rgba(30, 55, 38, 0.28),
                    rgba(30, 55, 38, 0.28)
                ),
                url("/images/sea.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            z-index: -2;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;

            background: rgba(255, 255, 245, 0.10);
            backdrop-filter: blur(1px);

            z-index: -1;
        }

        .container {
            width: 92%;
            max-width: 1000px;

            margin: 0 auto;
            padding: 38px 42px 45px;

            background:
                linear-gradient(
                    135deg,
                    rgba(250, 249, 239, 0.94),
                    rgba(239, 240, 224, 0.88)
                );

            border-radius: 28px;

            box-shadow:
                0 18px 45px rgba(20, 50, 30, 0.30),
                inset 0 0 0 1px rgba(255, 255, 255, 0.55);

            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;

            width: 100%;
            height: 7px;

            background:
                linear-gradient(
                    90deg,
                    #176b4b,
                    #4d896c,
                    #c99a3b,
                    #4d896c,
                    #176b4b
                );
        }

        h1 {
            margin: 0 0 10px;

            text-align: center;

            color: #31583f;

            font-size: 34px;
            letter-spacing: 5px;
            font-weight: 700;
        }

        .page-subtitle {
            text-align: center;

            margin-bottom: 30px;

            color: #777d6d;

            font-size: 15px;
            letter-spacing: 2px;
        }

        .detail-card {
            width: 100%;

            margin: 25px auto 0;

            background:
                rgba(255, 255, 255, 0.58);

            border-radius: 20px;

            box-shadow:
                0 8px 22px rgba(35, 60, 40, 0.12);

            overflow: hidden;

            border:
                1px solid rgba(100, 110, 90, 0.15);
        }

        .detail-header {
            padding: 18px 25px;

            background:
                linear-gradient(
                    135deg,
                    #285d43,
                    #397354
                );

            color: white;

            font-size: 17px;
            font-weight: 600;
            letter-spacing: 2px;

            border-bottom:
                3px solid #c8a14a;
        }

        .detail-body {
            padding: 10px 25px 20px;
        }

        .detail-row {
            display: flex;
            align-items: center;

            min-height: 58px;

            border-bottom:
                1px solid rgba(100, 110, 90, 0.16);

            transition:
                background 0.18s ease;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-row:hover {
            background:
                rgba(255, 252, 225, 0.72);
        }

        .detail-label {
            width: 260px;
            flex-shrink: 0;

            padding: 10px 15px 10px 5px;

            color: #52604e;

            font-size: 15px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .detail-value {
            flex: 1;

            padding: 10px 15px;

            color: #3f493f;

            font-size: 15px;
            font-weight: 500;

            word-break: break-word;
        }

        .id-value {
            color: #8b712e;
            font-weight: 700;
        }

        .type-value {
            color: #397052;
            font-weight: 700;
        }

        .bottom-actions {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: 14px;

            margin-top: 35px;

            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;

            padding: 10px 22px;

            margin: 3px;

            border: none;
            border-radius: 25px;

            text-decoration: none;

            font-family:
                "Noto Serif TC",
                "Microsoft JhengHei",
                sans-serif;

            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;

            cursor: pointer;

            transition: all 0.2s ease;

            box-shadow:
                0 3px 8px rgba(0, 0, 0, 0.12);
        }

        .btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 6px 14px rgba(0, 0, 0, 0.18);
        }

        .btn-success {
            background:
                linear-gradient(
                    135deg,
                    #197451,
                    #39906b
                );

            color: white;
        }

        .btn-primary {
            background:
                linear-gradient(
                    135deg,
                    #5d7f72,
                    #78988b
                );

            color: white;
        }

        .btn-gold {
            background:
                linear-gradient(
                    135deg,
                    #a98232,
                    #c9a14a
                );

            color: white;
        }

        @media (max-width: 900px) {

            body {
                padding: 20px 10px;
            }

            .container {
                width: 100%;
                padding: 30px 18px 35px;
                border-radius: 20px;
            }

            h1 {
                font-size: 28px;
                letter-spacing: 3px;
            }

            .detail-label {
                width: 220px;
            }
        }

        @media (max-width: 600px) {

            body {
                padding: 10px 5px;
            }

            .container {
                padding: 28px 10px 30px;
            }

            h1 {
                font-size: 24px;
                letter-spacing: 2px;
            }

            .page-subtitle {
                font-size: 13px;
            }

            .detail-row {
                display: block;
                padding: 10px 0;
            }

            .detail-label {
                width: 100%;
                padding: 5px 0;
            }

            .detail-value {
                padding: 5px 0;
            }

            .bottom-actions {
                flex-direction: column;
                align-items: stretch;
            }

            .bottom-actions .btn {
                text-align: center;
            }
        }

    </style>

</head>

<body>

<div class="container">

    <h1>旅客資料詳情</h1>

    <div class="page-subtitle">
        TRAVELER DETAILS
    </div>

    <div class="detail-card">

        <div class="detail-header">
            旅客資訊
        </div>

        <div class="detail-body">

            <div class="detail-row">
                <span class="detail-label">
                    travelers_id
                </span>

                <span
                    class="detail-value id-value"
                    th:text="${order_travelers.travelers_id}">
                    travelers_id
                </span>
            </div>

            <div class="detail-row">
                <span class="detail-label">
                    order_id
                </span>

                <span
                    class="detail-value id-value"
                    th:text="${order_travelers.orders.order_id}">
                    order_id
                </span>
            </div>

            <div class="detail-row">
                <span class="detail-label">
                    乘客姓名
                </span>

                <span
                    class="detail-value"
                    th:text="${order_travelers.travelers_real_name}">
                    乘客姓名
                </span>
            </div>

            <div class="detail-row">
                <span class="detail-label">
                    護照號碼
                </span>

                <span
                    class="detail-value"
                    th:text="${order_travelers.passport_num}">
                    護照號碼
                </span>
            </div>

            <div class="detail-row">
                <span class="detail-label">
                    電話
                </span>

                <span
                    class="detail-value"
                    th:text="${order_travelers.phone_num}">
                    電話
                </span>
            </div>

            <div class="detail-row">
                <span class="detail-label">
                    Line 帳號
                </span>

                <span
                    class="detail-value"
                    th:text="${order_travelers.line_account}">
                    Line帳號
                </span>
            </div>

            <div class="detail-row">
                <span class="detail-label">
                    特殊需求
                </span>

                <span
                    class="detail-value"
                    th:text="${order_travelers.special_request}">
                    特殊需求
                </span>
            </div>

            <div class="detail-row">
                <span class="detail-label">
                    成人／嬰兒
                </span>

                <span
                    class="detail-value type-value"
                    th:text="${order_travelers.traveler_type}">
                    成人／嬰兒
                </span>
            </div>

            <div class="detail-row">
                <span class="detail-label">
                    單／雙人床
                </span>

                <span
                    class="detail-value type-value"
                    th:text="${order_travelers.room_type}">
                    單／雙人床
                </span>
            </div>

        </div>

    </div>

    <div class="bottom-actions">

        <a
            th:href="@{/web/order_travelers/{travelers_id}/edit(travelers_id=${order_travelers.travelers_id})}"
            class="btn btn-success">
            編輯旅客資料
        </a>

        <a
            th:href="@{/web/order_travelers/order/{order_id}(order_id=${order_travelers.orders.order_id})}"
            class="btn btn-primary">
            新增旅客
        </a>

        <a
            th:href="@{/web/payments/checkout/{order_id}(order_id=${order_travelers.orders.order_id})}"
            class="btn btn-gold">
            前往付款
        </a>

    </div>

</div>

</body>
</html>
