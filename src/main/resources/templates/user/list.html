<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>使用者列表</title>

    <style>

        /* =========================================================
           基本設定
        ========================================================= */

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;

            font-family:
                "Noto Serif TC",
                "Microsoft JhengHei",
                "PingFang TC",
                serif;

            color: #3f493f;

            position: relative;
        }


        /* =========================================================
           背景圖片
           將你的森林照片放在：
           src/main/resources/static/images/forest.jpg
        ========================================================= */

        body::before {
            content: "";

            position: fixed;
            inset: 0;

            background-image:
                linear-gradient(
                    rgba(30, 55, 38, 0.28),
                    rgba(30, 55, 38, 0.28)
                ),
                url("/images/japan2.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            z-index: -2;
        }


        /* =========================================================
           背景柔化
        ========================================================= */

        body::after {
            content: "";

            position: fixed;
            inset: 0;

            background:
                rgba(255, 255, 245, 0.10);

            backdrop-filter: blur(1px);

            z-index: -1;
        }


        /* =========================================================
           主內容卡片
        ========================================================= */

        .container {

            width: 96%;
            max-width: 1500px;

            margin: 0 auto;

            padding: 38px 42px 45px;

            background:
                linear-gradient(
                    135deg,
                    rgba(250, 249, 239, 0.94),
                    rgba(239, 240, 224, 0.88)
                );

            border-radius: 28px;

            box-shadow:
                0 18px 45px rgba(20, 50, 30, 0.30),
                inset 0 0 0 1px rgba(255, 255, 255, 0.55);

            position: relative;

            overflow: hidden;
        }


        /* =========================================================
           卡片上方裝飾線
        ========================================================= */

        .container::before {

            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 7px;

            background:
                linear-gradient(
                    90deg,
                    #176b4b,
                    #4d896c,
                    #c99a3b,
                    #4d896c,
                    #176b4b
                );
        }


        /* =========================================================
           標題
        ========================================================= */

        h1 {

            margin: 0 0 10px;

            text-align: center;

            color: #31583f;

            font-size: 34px;

            letter-spacing: 5px;

            font-weight: 700;

            text-shadow:
                1px 1px 0 rgba(255, 255, 255, 0.8);
        }


        .page-subtitle {

            text-align: center;

            margin-bottom: 30px;

            color: #777d6d;

            font-size: 15px;

            letter-spacing: 2px;
        }


        /* =========================================================
           統計資訊
        ========================================================= */

        .statistics {

            display: flex;

            justify-content: center;

            margin: 25px 0;

        }


        .statistics-box {

            min-width: 220px;

            padding: 14px 30px;

            text-align: center;

            border-radius: 50px;

            background:
                rgba(255, 255, 255, 0.65);

            border: 1px solid rgba(75, 105, 80, 0.22);

            box-shadow:
                0 5px 15px rgba(40, 70, 45, 0.10);

            color: #52604e;

            letter-spacing: 2px;
        }


        .statistics-number {

            color: #bd2929;

            font-size: 23px;

            font-weight: bold;

            margin: 0 5px;
        }


        /* =========================================================
           成功訊息
        ========================================================= */

        .alert {

            margin: 20px auto;

            padding: 13px 20px;

            max-width: 700px;

            text-align: center;

            border-radius: 12px;

            letter-spacing: 1px;

            font-size: 15px;
        }


        .alert-success {

            background:
                rgba(216, 239, 218, 0.88);

            color: #285f38;

            border:
                1px solid rgba(72, 125, 82, 0.25);

            box-shadow:
                0 4px 12px rgba(50, 100, 60, 0.10);
        }


        /* =========================================================
           操作區
        ========================================================= */

        .toolbar {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin: 25px 0 20px;

            gap: 15px;

            flex-wrap: wrap;
        }


        /* =========================================================
           表格外框
        ========================================================= */

        .table-wrapper {

            width: 100%;

            overflow-x: auto;

            border-radius: 18px;

            box-shadow:
                0 8px 22px rgba(35, 60, 40, 0.12);

            background:
                rgba(255, 255, 255, 0.45);
        }


        /* =========================================================
           使用者表格
        ========================================================= */

        table {

            width: 100%;

            min-width: 1050px;

            border-collapse: separate;

            border-spacing: 0;

            overflow: hidden;
        }


        /* =========================================================
           表頭
        ========================================================= */

        th {

            padding: 16px 14px;

            background:
                linear-gradient(
                    135deg,
                    #285d43,
                    #397354
                );

            color: #fff;

            font-size: 15px;

            font-weight: 600;

            letter-spacing: 1px;

            text-align: center;

            white-space: nowrap;

            border-bottom:
                3px solid #c8a14a;
        }


        th:first-child {
            border-top-left-radius: 14px;
        }


        th:last-child {
            border-top-right-radius: 14px;
        }


        /* =========================================================
           表格內容
        ========================================================= */

        td {

            padding: 15px 13px;

            text-align: center;

            color: #4d554b;

            font-size: 14px;

            border-bottom:
                1px solid rgba(100, 110, 90, 0.16);

            background:
                rgba(255, 255, 255, 0.58);

            white-space: nowrap;
        }


        /* =========================================================
           偶數列
        ========================================================= */

        tbody tr:nth-child(even) td {

            background:
                rgba(238, 239, 225, 0.70);
        }


        /* =========================================================
           Hover
        ========================================================= */

        tbody tr {

            transition:
                transform 0.18s ease,
                box-shadow 0.18s ease;
        }


        tbody tr:hover {

            transform: translateY(-1px);
        }


        tbody tr:hover td {

            background:
                rgba(255, 252, 225, 0.92);

            color: #334735;
        }


        /* =========================================================
           ID
        ========================================================= */

        td:first-child {

            color: #8b712e;

            font-weight: bold;
        }


        /* =========================================================
           狀態欄
        ========================================================= */

        td:nth-child(6) {

            font-weight: 600;

            color: #397052;
        }


        /* =========================================================
           按鈕基本設定
        ========================================================= */

        .btn {

            display: inline-block;

            padding: 9px 17px;

            margin: 3px;

            border: none;

            border-radius: 25px;

            text-decoration: none;

            font-family:
                "Noto Serif TC",
                "Microsoft JhengHei",
                sans-serif;

            font-size: 14px;

            font-weight: 600;

            letter-spacing: 1px;

            cursor: pointer;

            transition:
                all 0.2s ease;

            box-shadow:
                0 3px 8px rgba(0, 0, 0, 0.12);
        }


        .btn:hover {

            transform: translateY(-2px);

            box-shadow:
                0 6px 14px rgba(0, 0, 0, 0.18);
        }


        .btn:active {

            transform: translateY(0);

            box-shadow:
                0 2px 5px rgba(0, 0, 0, 0.12);
        }


        /* =========================================================
           建立 / 成功按鈕
        ========================================================= */

        .btn-success {

            background:
                linear-gradient(
                    135deg,
                    #197451,
                    #39906b
                );

            color: white;
        }


        .btn-success:hover {

            background:
                linear-gradient(
                    135deg,
                    #126043,
                    #2e7959
                );
        }


        /* =========================================================
           詳情按鈕
        ========================================================= */

        .btn-primary {

            background:
                linear-gradient(
                    135deg,
                    #5d7f72,
                    #78988b
                );

            color: white;
        }


        .btn-primary:hover {

            background:
                linear-gradient(
                    135deg,
                    #476b5d,
                    #668879
                );
        }


        /* =========================================================
           刪除按鈕
        ========================================================= */

        .btn-danger {

            background:
                linear-gradient(
                    135deg,
                    #a33a3a,
                    #c75555
                );

            color: white;
        }


        .btn-danger:hover {

            background:
                linear-gradient(
                    135deg,
                    #8d2929,
                    #ae4242
                );
        }


        /* =========================================================
           操作欄
        ========================================================= */

        .action-cell {

            min-width: 260px;

            white-space: normal;
        }


        .action-cell form {

            display: inline-block;

            margin: 0;
        }


        /* =========================================================
           返回按鈕區
        ========================================================= */

        .bottom-actions {

            display: flex;

            justify-content: center;

            gap: 14px;

            margin-top: 35px;

            flex-wrap: wrap;
        }


        /* =========================================================
           響應式設計
        ========================================================= */

        @media (max-width: 900px) {

            body {
                padding: 20px 10px;
            }

            .container {

                width: 100%;

                padding:
                    30px 18px 35px;

                border-radius: 20px;
            }

            h1 {

                font-size: 28px;

                letter-spacing: 3px;
            }

            .toolbar {

                justify-content: center;
            }

        }


        @media (max-width: 600px) {

            body {
                padding: 10px 5px;
            }

            .container {

                padding:
                    28px 10px 30px;
            }

            h1 {

                font-size: 24px;

                letter-spacing: 2px;
            }

            .page-subtitle {

                font-size: 13px;
            }

            .statistics-box {

                min-width: 180px;

                padding:
                    12px 20px;
            }

            .bottom-actions {

                flex-direction: column;

                align-items: stretch;
            }

            .bottom-actions .btn {

                text-align: center;
            }

        }

    </style>

</head>


<body>

<div class="container">

    <!-- =====================================================
         標題
    ====================================================== -->

    <h1>使用者管理</h1>

    <div class="page-subtitle">
        MEMBER MANAGEMENT
    </div>


    <!-- =====================================================
         成功訊息
    ====================================================== -->

    <div
        th:if="${successMessage}"
        class="alert alert-success"
        th:text="${successMessage}">
        成功訊息
    </div>


    <!-- =====================================================
         統計資訊
    ====================================================== -->

    <div class="statistics">

        <div class="statistics-box">

            目前共有

            <span
                class="statistics-number"
                th:text="${userCount}">
                0
            </span>

            位使用者

        </div>

    </div>


    <!-- =====================================================
         工具列
    ====================================================== -->

    <div class="toolbar">

        <div>

            <a
                th:href="@{/web/user/create}"
                class="btn btn-success">

                ＋ 建立新使用者

            </a>

        </div>

    </div>


    <!-- =====================================================
         使用者表格
    ====================================================== -->

    <div class="table-wrapper">

        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>姓名</th>

                    <th>Email</th>

                    <th>角色</th>

                    <th>電話</th>

                    <th>狀態</th>

                    <th>密碼</th>

                    <th>創建時間</th>

                    <th>更新時間</th>

                    <th>操作</th>

                </tr>

            </thead>


            <tbody>

                <tr th:each="user : ${users}">

                    <!-- ID -->

                    <td
                        th:text="${user.id}">
                        ID
                    </td>


                    <!-- 姓名 -->

                    <td
                        th:text="${user.name}">
                        姓名
                    </td>


                    <!-- Email -->

                    <td
                        th:text="${user.email}">
                        Email
                    </td>


                    <!-- 角色 -->

                    <td
                        th:text="${user.role}">
                        角色
                    </td>


                    <!-- 電話 -->

                    <td
                        th:text="${user.phone}">
                        電話
                    </td>


                    <!-- 狀態 -->

                    <td
                        th:text="${user.account_status}">
                        狀態
                    </td>


                    <!-- 密碼 -->

                    <td
                        th:text="${user.password_hash}">
                        密碼
                    </td>


                    <!-- 創建時間 -->

                    <td
                        th:text="${user.created_at}">
                        創建時間
                    </td>


                    <!-- 更新時間 -->

                    <td
                        th:text="${user.updated_at}">
                        更新時間
                    </td>


                    <!-- =================================================
                         操作
                    ================================================== -->

                    <td class="action-cell">

                        <!-- 詳情 -->

                        <a
                            th:href="@{/web/user/{id}(id=${user.id})}"
                            class="btn btn-primary">

                            詳情

                        </a>


                        <!-- 編輯 -->

                        <a
                            th:href="@{/web/user/{id}/edit(id=${user.id})}"
                            class="btn btn-success">

                            編輯

                        </a>


                        <!-- 刪除 -->

                        <form
                            th:action="@{/web/user/{id}/delete(id=${user.id})}"
                            method="post">

                            <button
                                type="submit"
                                class="btn btn-danger"
                                onclick="return confirm('確定要刪除嗎？')">

                                刪除

                            </button>

                        </form>

                    </td>

                </tr>

            </tbody>

        </table>

    </div>


    <!-- =====================================================
         返回按鈕
    ====================================================== -->

    <div class="bottom-actions">

        <a
            th:href="@{/web/dashboard}"
            class="btn btn-success">

            返回管理者後台

        </a>

    </div>

</div>

</body>

</html>
