<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${isEdit} ? '編輯使用者' : '建立使用者'">
        使用者表單
    </title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            font-family:
                "Noto Serif TC",
                "Microsoft JhengHei",
                "PingFang TC",
                serif;
            color: #3f493f;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(
                    rgba(30, 55, 38, 0.28),
                    rgba(30, 55, 38, 0.28)
                ),
                url("/images/japan2.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -2;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 245, 0.10);
            backdrop-filter: blur(1px);
            z-index: -1;
        }

        .container {
            width: 92%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 38px 42px 45px;
            background:
                linear-gradient(
                    135deg,
                    rgba(250, 249, 239, 0.94),
                    rgba(239, 240, 224, 0.88)
                );
            border-radius: 28px;
            box-shadow:
                0 18px 45px rgba(20, 50, 30, 0.30),
                inset 0 0 0 1px rgba(255, 255, 255, 0.55);
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 7px;
            background:
                linear-gradient(
                    90deg,
                    #176b4b,
                    #4d896c,
                    #c99a3b,
                    #4d896c,
                    #176b4b
                );
        }

        h1 {
            margin: 0 0 10px;
            text-align: center;
            color: #31583f;
            font-size: 34px;
            letter-spacing: 5px;
            font-weight: 700;
            text-shadow:
                1px 1px 0 rgba(255, 255, 255, 0.8);
        }

        .page-subtitle {
            text-align: center;
            margin-bottom: 30px;
            color: #777d6d;
            font-size: 15px;
            letter-spacing: 2px;
        }

        .form-card {
            width: 100%;
            margin: 25px auto 0;
            background: rgba(255, 255, 255, 0.58);
            border-radius: 20px;
            box-shadow:
                0 8px 22px rgba(35, 60, 40, 0.12);
            overflow: hidden;
            border: 1px solid rgba(100, 110, 90, 0.15);
        }

        .form-header {
            padding: 18px 25px;
            background:
                linear-gradient(
                    135deg,
                    #285d43,
                    #397354
                );
            color: white;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 2px;
            border-bottom: 3px solid #c8a14a;
        }

        .form-body {
            padding: 28px 30px 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #52604e;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid rgba(100, 110, 90, 0.25);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.78);
            color: #3f493f;
            font-family:
                "Noto Serif TC",
                "Microsoft JhengHei",
                sans-serif;
            font-size: 15px;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #397052;
            box-shadow: 0 0 0 3px rgba(57, 112, 82, 0.12);
            background: white;
        }

        .form-hint {
            margin-top: 6px;
            color: #8a8d80;
            font-size: 12px;
        }

        .bottom-actions {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 11px 25px;
            margin: 3px;
            border: none;
            border-radius: 25px;
            text-decoration: none;
            font-family:
                "Noto Serif TC",
                "Microsoft JhengHei",
                sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow:
                0 3px 8px rgba(0, 0, 0, 0.12);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow:
                0 6px 14px rgba(0, 0, 0, 0.18);
        }

        .btn-primary {
            background:
                linear-gradient(
                    135deg,
                    #197451,
                    #39906b
                );
            color: white;
        }

        .btn-primary:hover {
            background:
                linear-gradient(
                    135deg,
                    #126043,
                    #2e7959
                );
        }

        .btn-secondary {
            background:
                linear-gradient(
                    135deg,
                    #5d7f72,
                    #78988b
                );
            color: white;
        }

        .btn-secondary:hover {
            background:
                linear-gradient(
                    135deg,
                    #476b5d,
                    #668879
                );
        }

        @media (max-width: 900px) {
            body {
                padding: 20px 10px;
            }

            .container {
                width: 100%;
                padding: 30px 18px 35px;
                border-radius: 20px;
            }

            h1 {
                font-size: 28px;
                letter-spacing: 3px;
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 10px 5px;
            }

            .container {
                padding: 28px 10px 30px;
            }

            h1 {
                font-size: 24px;
                letter-spacing: 2px;
            }

            .page-subtitle {
                font-size: 13px;
            }

            .form-body {
                padding: 22px 18px;
            }

            .bottom-actions {
                flex-direction: column;
                align-items: stretch;
            }

            .bottom-actions .btn {
                text-align: center;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1 th:text="${isEdit} ? '編輯使用者' : '建立新使用者'">
        使用者表單
    </h1>

    <div class="page-subtitle">
        USER INFORMATION
    </div>

    <div class="form-card">

        <div class="form-header">
            使用者資料
        </div>

        <div class="form-body">

            <form
                th:action="${isEdit} ? @{/web/user/{id}/edit(id=${user.id})} : @{/web/user/create}"
                method="post"
                th:object="${user}">

                <div class="form-group">
                    <label for="name">姓名</label>
                    <input
                        type="text"
                        id="name"
                        th:field="*{name}"
                        placeholder="請輸入姓名"
                        required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        th:field="*{email}"
                        placeholder="請輸入 Email"
                        required>
                </div>

                <div class="form-group">
                    <label for="role">角色</label>
                    <input
                        type="text"
                        id="role"
                        th:field="*{role}"
                        placeholder="例如：USER / ADMIN"
                        required>
                </div>

                <div class="form-group">
                    <label for="phone">電話</label>
                    <input
                        type="text"
                        id="phone"
                        th:field="*{phone}"
                        placeholder="請輸入電話號碼"
                        required>
                </div>

                <div class="form-group">
                    <label for="password_hash">密碼</label>
                    <input
                        type="text"
                        id="password_hash"
                        th:field="*{password_hash}"
                        placeholder="請輸入密碼"
                        required>
                </div>

                <div class="form-group">
                    <label for="account_status">帳號狀態</label>
                    <input
                        type="text"
                        id="account_status"
                        th:field="*{account_status}"
                        placeholder="例如：active / disabled"
                        required>
                </div>

                <div class="bottom-actions">

                    <button
                        type="submit"
                        class="btn btn-primary"
                        th:text="${isEdit} ? '更新' : '建立'">
                        建立
                    </button>

                    <a
                        th:href="@{/web/user}"
                        class="btn btn-secondary">
                        取消
                    </a>

                </div>

            </form>

        </div>
    </div>

</div>

</body>
</html>
